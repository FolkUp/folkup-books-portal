# License: CC BY-SA 4.0 (S100/S135 canon)
# Covers v1 (S138 Иви pack): временные, канон до финального арта Фриды/Ремедиос.
#   Каждая обложка несёт круглый штамп «ЭКСПОНАТ НА РЕСТАВРАЦИИ» (переведён по языку).
#   DE обложки содержат «Kommandant» — pending regen с «Comandante» per Иви S152.
# CANON v2 «Своим умом» Iskra S214 2026-07-23 (виза Andrey «раз и навсегда»):
#   Серия — «Своим умом»; читателю нумерация НЕ показывается (canon v2 §1).
#   Внутренний порядок = карта замысла: создаём → получаем без искажений → договариваемся.
#   Три трилогии: I. «Своими силами» (kn1+kn3+kn4) · II. «Из первых рук» (kn2+kn5+kn6) · III. «Общий язык» (kn7+…)
#   Slug ≠ position: URL /kn1–/kn7 живой, не меняем; position = поле сортировки карточек.

series:
  # CANON v2 Iskra S214: серия «Своим умом» (виза Andrey — «FolkUp» бренд, не имя серии).
  # DE/EN/PT идиомы уйдут Болику/Лёлику/Зеке отдельно; до их вердикта — RU placeholder.
  name: Своим умом
  # Public author display = pseudonym per Andrei Q10 verdict via Iskra S178b 2026-07-18.
  # Legal name «Andrei Klemenchionok» reserved для /ai-disclosure page (AI Act Art. 50(4))
  # per Лев Option F + Andrei explicit «Моё имя указываем только там, где требуется юридически».
  author: Команданте FolkUp
  author_url: https://books.folkup.life/#author
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  total_books: 7
  publisher: FolkUp Ecosystem
  publisher_imprint: Редакция FolkUp
  # Трилогии — внутренняя карта замысла (canon v2 §3).
  # DE/EN/PT — placeholder RU до перевода (Iskra §1 «не подстрочник»).
  # Iskra §3 VITRINNYY-PAKET S214: подписи-описания для группировки на главной.
  # Третью трилогию НЕ пишем «в работе» — читатель видит группу с одной книгой,
  # когда выйдут остальные, группа просто пополнится (Iskra §3 canonical).
  trilogies:
    svoimi_silami:
      name: Своими силами
      arc: команда создаёт
      description: >-
        Как команда делает своё дело: учится видеть себя, придумывает лучшее
        устройство и рождает то, чего раньше не было.
    iz_pervyh_ruk:
      name: Из первых рук
      arc: знание доходит до нас
      description: >-
        Как знание доходит до нас: сквозь тех, кто его запирал, через тех, кто
        стоит посредине, — и как проверить, что донесли именно то.
    obshchiy_yazyk:
      name: Общий язык
      arc: люди договариваются
      description: >-
        Почему договориться труднее, чем кажется, и что с этим делать.

