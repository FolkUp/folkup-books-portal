name: Deploy books.folkup.life

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      content-only: ${{ steps.paths.outputs.content-only }}
    steps:
      # fetch-depth=1 достаточно для build/deploy (was 0 = full history).
      # Экономит ~30-60s clone time для large repo.
      # Path filter step ниже подтягивает base ref shallow через git fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # CI-optimization cont+30 S3SCOOP B1: Detect content-only PRs → skip Playwright.
      # Content-only paths (не triggers full test suite):
      #   - content/**              — chapter markdown + adoc + pro-chto
      #   - public/*/downloads/**   — EPUB/PDF binary placement
      #   - data/series.yaml        — book metadata
      #   - *.md at root            — docs (README, CHANGELOG, etc)
      # Any file OUTSIDE these paths → full CI (code/tests/config changed).
      # Push events (main) always run full CI (no path filter).
      - name: Detect content-only PR
        id: paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Use gh CLI (available in GitHub Actions runner) — API-based, no git history needed.
          # Prior attempt via git diff failed on fetch-depth=1 (no merge base найден).
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          echo "Changed files:"
          echo "$CHANGED"
          echo ""
          # Filter out content-only paths — если остаётся что-то → non-content PR
          NON_CONTENT=$(echo "$CHANGED" | grep -vE '^(content/|public/[^/]+/downloads/|data/series\.yaml|[^/]+\.md$)' || true)
          if [ -z "$NON_CONTENT" ]; then
            echo "content-only=true" >> "$GITHUB_OUTPUT"
            echo "🟢 Content-only PR — skip Playwright (save ~5-8 min)"
          else
            echo "content-only=false" >> "$GITHUB_OUTPUT"
            echo "🔴 Non-content changes detected — full CI"
            echo "Files требующие full CI:"
            echo "$NON_CONTENT"
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint --if-present || echo "lint скипнут — no config"

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build (vite-ssg)
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/llms.txt
          test -f dist/_redirects
          test -f dist/_headers
          echo "✓ All required artifacts present"

      - name: Bundle size check (60KB gzip gate)
        run: |
          MAX_KB=60
          for js in dist/assets/*.js; do
            KB=$(gzip -c "$js" | wc -c | awk '{print int($1/1024)}')
            echo "$js: ${KB}KB gzip"
            if [ "$KB" -gt "$MAX_KB" ]; then
              echo "❌ Bundle exceeds ${MAX_KB}KB gate"
              exit 1
            fi
          done

      # Playwright browsers install — только для non-content PRs + push events.
      # Skip для content-only PR economies ~1-2 min.
      - name: Install Playwright browsers (все браузеры — playwright.config uses WebKit для mobile viewports)
        if: steps.paths.outputs.content-only != 'true'
        run: npx playwright install --with-deps chromium webkit

      # Playwright tests — full E2E + visual regression + a11y + Schema.
      # Skip для content-only PRs (chapter markdown / EPUB placement / series.yaml —
      # не меняют code, layout, или tests). Экономит ~5-8 min per такой PR.
      # Non-blocking пока visual regression baselines не committed.
      - name: Run Playwright tests (E2E + visual regression + a11y + Schema.org)
        if: steps.paths.outputs.content-only != 'true'
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        # if: failure() only — экономит artifact quota (упирались на success too).
        # Cot+31 B1 fix: prior `if: always()` заливал 55 files каждый green run.
        # При pass — report не нужен, при fail — нужен для диагностики.
        # Also skipped для content-only PRs (Playwright не ran → нет report).
        if: failure() && steps.paths.outputs.content-only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy к Cloudflare Pages (main branch only)
        # cloudflare/pages-action ARCHIVED 2026-07-27 by Cloudflare, replaced by
        # wrangler-action. Migration per Kuper R-K4 (SHA-pin) + Andrey Q6 verdict
        # cont+24 Variant A. Canonical pattern aligned с agile-sapiens/orga/landing
        # deploy-cf-backup.yml (v3.14.1 SHA `da0e0dfe...`).
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: df4ac254f54d45ae99d2273c0f1af48c
          command: pages deploy dist --project-name=books-folkup-life --branch=main --commit-message="portal auto-deploy ${{ github.sha }}"

      - name: Post-deploy smoke test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # curl -L следует за redirects (CF Pages нормализует /kn1/ 308 -> /kn1)
          # Матчим финальный 200 после всей цепочки — так же как видит браузер юзера.
          for url in https://books.folkup.life/ \
                     https://books.folkup.life/kn1/ \
                     https://books.folkup.life/kn5/ \
                     https://books.folkup.life/robots.txt \
                     https://books.folkup.life/llms.txt; do
            for i in 1 2 3; do
              STATUS=$(curl -sSL --max-time 15 -o /dev/null -w "%{http_code}" "$url")
              if [ "$STATUS" = "200" ]; then
                echo "✓ $url ($STATUS)"
                break
              fi
              [ $i -eq 3 ] && (echo "❌ $url ($STATUS)" && exit 1)
              sleep 3
            done
          done

      - name: IndexNow ping (Bing + Yandex — Google не поддерживает)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "TODO: IndexNow ping after key file setup"
          # curl -X POST https://api.indexnow.org/indexnow \
          #   -H "Content-Type: application/json" \
          #   -d '{"host":"books.folkup.life","key":"KEY","urlList":["..."]}'

  preview-headers:
    # Preview branches получают X-Robots-Tag: noindex, nofollow
    # per Андрей mandate cont +39 «noindex только на unpublished»
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Note preview noindex
        run: |
          echo "PR builds → preview URL <branch>.books-folkup-life.pages.dev"
          echo "TODO: Inject X-Robots-Tag: noindex, nofollow into preview _headers"
